<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="Practica los tiempos verbales en inglés: conjugación, identificación, ahorcado y repetición espaciada." />
  <meta name="theme-color" content="#4f46e5" />
  <title>English Tenses</title>
  <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="%BASE_URL%icon.svg" />
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  <script>
    // Aplica el tema guardado antes de pintar para evitar el parpadeo
    try {
      var t = localStorage.getItem('ett-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="#/home" class="brand">
        <span class="logo" aria-hidden="true">T</span>
        <span>English Tenses</span>
      </a>
      <div class="top-actions">
        <div id="stats" class="stats"></div>
        <button id="lang" class="icon-btn text" type="button"></button>
        <button id="theme" class="icon-btn" type="button"></button>
      </div>
    </div>
  </header>
  <nav id="nav" class="tabs" aria-label="Main"></nav>
  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
